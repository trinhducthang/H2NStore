# File này nằm trong http {} (conf.d), nên khai báo map được ở đây.
# Đứng sau Cloudflare/proxy khác: giữ nguyên X-Forwarded-Proto gốc nếu có.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Đứng sau Cloudflare (bật proxy đám mây cam): bỏ comment để lấy IP thật của khách,
    # nếu không backend sẽ rate limit theo IP của Cloudflare. Danh sách IP: https://www.cloudflare.com/ips/
    # real_ip_header CF-Connecting-IP;
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 172.64.0.0/13;
    # ... (thêm đủ các dải còn lại)

    # Upload: ảnh tối đa 5MB, video đánh giá tối đa 30MB; 1 đánh giá gửi tối đa 5 ảnh + 1 video
    client_max_body_size 60m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               application/xml image/svg+xml;

    # Không mở Actuator ra ngoài (chỉ dùng trong mạng nội bộ docker)
    location ^~ /actuator {
        return 404;
    }

    # REST API (kể cả webhook SePay /api/public/payments/sepay/webhook)
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Ảnh upload: nginx đọc thẳng từ volume, không qua Spring
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # File do khách tải lên: không cho trình duyệt đoán lại kiểu (VD: coi là HTML)
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # File build có hash trong tên -> cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: mọi đường dẫn khác trả về index.html để React Router xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }
}
