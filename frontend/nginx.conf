# File này nằm trong http {} (conf.d), nên khai báo map được ở đây.
# Đứng sau Cloudflare/proxy khác: giữ nguyên X-Forwarded-Proto gốc nếu có.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Đứng sau Cloudflare (bật proxy đám mây cam): bỏ comment để lấy IP thật của khách,
    # nếu không backend sẽ rate limit theo IP của Cloudflare. Danh sách IP: https://www.cloudflare.com/ips/
    # real_ip_header CF-Connecting-IP;
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 172.64.0.0/13;
    # ... (thêm đủ các dải còn lại)

    # Upload: ảnh tối đa 5MB, video đánh giá tối đa 30MB; 1 đánh giá gửi tối đa 5 ảnh + 1 video
    client_max_body_size 60m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               application/xml image/svg+xml;

    # Không mở Actuator ra ngoài (chỉ dùng trong mạng nội bộ docker)
    location ^~ /actuator {
        return 404;
    }

    # REST API (kể cả webhook SePay /api/public/payments/sepay/webhook)
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Ảnh upload: nginx đọc thẳng từ volume, không qua Spring
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # File do khách tải lên: không cho trình duyệt đoán lại kiểu (VD: coi là HTML)
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # File build có hash trong tên -> cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SEO: bot AI và trình xem trước link (Zalo, Facebook) chỉ đọc HTML thô, không chạy JS.
    # index.html bật SSI, gọi 2 subrequest /__seo/head, /__seo/body để chèn thẻ meta/JSON-LD vào <head>
    # và nội dung tóm tắt vào #root theo đúng URL khách mở. Backend lỗi thì giữ thẻ mặc định trong index.html.
    location = /index.html {
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-cache";
    }

    location ^~ /__seo/ {
        internal;
        proxy_pass http://app:8080/api/public/seo/;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        # Trong subrequest, $request_uri vẫn là URL gốc khách mở (VD: /products/bo-hoa?utm_source=zalo)
        proxy_set_header X-Seo-Uri $request_uri;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        # Không chèn trang lỗi của backend vào HTML
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @seo_empty;
    }

    location @seo_empty {
        return 204;
    }

    # Sinh từ dữ liệu danh mục/sản phẩm, đường dẫn tuyệt đối theo FRONTEND_URL của backend
    location = /robots.txt {
        proxy_pass http://app:8080/api/public/seo/robots.txt;
    }

    location = /sitemap.xml {
        proxy_pass http://app:8080/api/public/seo/sitemap.xml;
    }

    location = /llms.txt {
        proxy_pass http://app:8080/api/public/seo/llms.txt;
    }

    # SPA: mọi đường dẫn khác trả về index.html để React Router xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }
}
