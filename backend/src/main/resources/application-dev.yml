spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    out-of-order: true
    placeholders:
      # V100/V101 đã tạo cây danh mục mẫu cùng slug, V5 chạy sẽ lỗi trùng ở DB dev mới
      seed-default-categories: false

app:
  jwt:
    cookie-secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  sepay:
    # Key mặc định cho dev để test webhook bằng curl
    webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:dev-sepay-key}

logging:
  level:
    com.flowershop: DEBUG
